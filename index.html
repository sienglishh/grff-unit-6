<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Từ Vựng Tiếng Anh - Dream Jobs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #0d5c3a;
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    }

    .card {
      width: 340px;
      height: 420px;
      background: #ffffff;
      border-radius: 25px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .icon {
      font-size: 5rem;
      margin-top: 10px;
    }

    .text-container {
      text-align: center;
    }

    .word {
      font-size: 1.8rem;
      font-weight: bold;
      color: #117a4c;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 1.3rem;
      font-weight: bold;
      color: #0d5c3a;
    }

    .btn-audio {
      background: #117a4c;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(17, 122, 76, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-audio:hover {
      background: #199d63;
      transform: scale(1.05);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-nav {
      background: #0d5c3a;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(13, 92, 58, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background: #117a4c;
      transform: scale(1.05);
    }

    .progress {
      font-size: 1.2rem;
      font-weight: bold;
      color: #0d5c3a;
      background: rgba(255,255,255,0.9);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>👨‍🚀 Dream Jobs Vocabulary 👩‍🚒</h1>

  <div class="card">
    <div class="icon" id="icon">🎨</div>
    
    <div class="text-container">
      <div class="word" id="word">artist</div>
      <div class="meaning" id="meaning">hoạ sĩ / nghệ sĩ</div>
    </div>

    <button class="btn-audio" onclick="speakCurrentWord()">🔊 Nghe đọc</button>
  </div>

  <div class="controls">
    <button class="btn-nav" onclick="prevCard()">◄ Trước</button>
    <div class="progress" id="progress">1 / 35</div>
    <button class="btn-nav" onclick="nextCard()">Sau ►</button>
  </div>

  <script>
    const vocabulary = [
      { word: "artist", meaning: "hoạ sĩ / nghệ sĩ", icon: "🎨" },
      { word: "astronaut", meaning: "phi hành gia", icon: "👨‍🚀" },
      { word: "bandage", meaning: "băng gạc", icon: "🩹" },
      { word: "begin", meaning: "bắt đầu", icon: "🚀" },
      { word: "businessman / businesswoman", meaning: "doanh nhân nam / nữ", icon: "💼" },
      { word: "cook", meaning: "đầu bếp", icon: "🧑‍🍳" },
      { word: "dentist", meaning: "nha sĩ", icon: "🦷" },
      { word: "designer", meaning: "nhà thiết kế", icon: "✏️" },
      { word: "doctor", meaning: "bác sĩ", icon: "👨‍⚕️" },
      { word: "each", meaning: "mỗi", icon: "👉" },
      { word: "early", meaning: "sớm", icon: "🌅" },
      { word: "engineer", meaning: "kỹ sư", icon: "👷" },
      { word: "fast", meaning: "nhanh", icon: "⚡" },
      { word: "fire fighter", meaning: "lính cứu hỏa", icon: "👨‍🚒" },
      { word: "happen", meaning: "xảy ra", icon: "❓" },
      { word: "job", meaning: "công việc / nghề nghiệp", icon: "🧰" },
      { word: "journalist", meaning: "nhà báo", icon: "📰" },
      { word: "lazy", meaning: "lười biếng", icon: "🦥" },
      { word: "look after", meaning: "chăm sóc", icon: "🤝" },
      { word: "manager", meaning: "quản lý", icon: "📊" },
      { word: "mechanic", meaning: "thợ cơ khí", icon: "🔧" },
      { word: "meeting", meaning: "cuộc họp", icon: "👥" },
      { word: "nowhere", meaning: "không nơi nào", icon: "🚫" },
      { word: "nurse", meaning: "y tá", icon: "👩‍⚕️" },
      { word: "office", meaning: "văn phòng", icon: "🏢" },
      { word: "perhaps", meaning: "có lẽ", icon: "🤔" },
      { word: "photographer", meaning: "nhiếp ảnh gia", icon: "📷" },
      { word: "pilot", meaning: "phi công", icon: "👨‍✈️" },
      { word: "police officer", meaning: "cảnh sát", icon: "👮" },
      { word: "poor", meaning: "nghèo", icon: "🏚️" },
      { word: "rich", meaning: "giàu có", icon: "💎" },
      { word: "singer", meaning: "ca sĩ", icon: "🎤" },
      { word: "teacher", meaning: "giáo viên", icon: "👩‍🏫" },
      { word: "tennis player", meaning: "vận động viên quần vợt", icon: "🎾" },
      { word: "waiter", meaning: "bồi bàn / phục vụ", icon: "🍽️" }
    ];

    let currentIndex = 0;
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const iconElement = document.getElementById('icon');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      const item = vocabulary[currentIndex];
      wordElement.textContent = item.word;
      meaningElement.textContent = item.meaning;
      iconElement.textContent = item.icon;
      progressElement.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < vocabulary.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakCurrentWord() {
      const textToSpeak = vocabulary[currentIndex].word.replace(/\(.*?\)/g, '').trim();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    updateCard();
  </script>
</body>
</html>
